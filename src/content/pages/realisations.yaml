    - { type: "Story", sujet: "Sondage : votre prochaine envie", photo: ./images/social-5.jpg }
    - { type: "Reel", sujet: "Une journée dans le commerce", photo: ./images/social-6.jpg }
    - { type: "Post", sujet: "Annonce d'un nouvel horaire", photo: ./images/social-7.jpg }
    - { type: "Story", sujet: "Question-réponse en direct", photo: ./images/social-8.jpg }
