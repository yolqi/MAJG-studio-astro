faq:
  eyebrow: "Questions fréquentes"
  title: "Les réponses aux questions qu'on nous pose."
  items:
    - question: "Combien coûte un site ?"
      answer: "Chaque projet est sur-mesure. Le prix dépend du nombre de sections, des fonctionnalités et du contenu. Nos formules démarrent à 390 € pour une page vitrine. Le devis est gratuit et sans engagement."
    - question: "Comment se passe le paiement ?"
      answer: "Un petit acompte au démarrage (couvre nos frais), le solde seulement quand le site est en ligne et que vous êtes satisfait. Pas de mauvaise surprise, pas de paiement intégral à l'aveugle."
    - question: "C'est quoi, la « démo gratuite » ?"
      answer: "Avant tout engagement, on conçoit un vrai aperçu de votre site, à votre nom, pour que vous voyiez concrètement le rendu. Vous ne payez que si ça vous plaît et que vous décidez d'aller plus loin."
    - question: "Et l'hébergement, c'est compris ?"
      answer: "La mise en ligne est incluse. L'hébergement et le nom de domaine se souscrivent à votre nom (environ 10 à 15 € par mois selon les options) — vous restez propriétaire de votre site et de votre adresse."
    - question: "En combien de temps mon site est-il prêt ?"
      answer: "Le délai dépend du projet et de la rapidité à nous transmettre vos contenus (photos, textes). Le process est cadré dès le départ, et vous savez à chaque étape où on en est."
    - question: "Vous intervenez où ?"
      answer: "Nous sommes basés à Marseille, et nous accompagnons des commerces partout en France. La majorité du travail — conception, échanges, contenu — se fait à distance ; si vous êtes sur place, on peut aussi se rencontrer en personne."
    - question: "Je peux refaire un site que j'ai déjà ?"
      answer: "Oui. On peut repartir de zéro ou refondre un site existant pour améliorer son image, sa lisibilité sur mobile et sa visibilité sur Google."
    - question: "Vous gérez aussi nos réseaux sociaux ?"
      answer: "Oui, c'est notre deuxième activité : création de contenu, gestion Instagram/Facebook, et même déplacement pour shooting photo ou vidéo selon la formule. On peut s'en occuper seul, ou en complément d'un site."
    - question: "Forfait mensuel ou prestation ponctuelle, comment choisir ?"
      answer: "Si vous voulez juste un coup de pouce ponctuel (logo, visuels, mise en place d'une page), on fait une prestation à l'unité. Si vous voulez une présence régulière et entretenue sur vos réseaux, un forfait mensuel est plus adapté — et plus économique sur la durée."

