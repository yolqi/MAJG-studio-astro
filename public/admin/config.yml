          - label: "Encarts d'information"
            name: infoItems
            widget: list
            fields:
              - { label: Nom, name: label, widget: string }
              - { label: Valeur, name: value, widget: string }

      - name: tarifs
        label: Tarifs
        file: src/content/pages/tarifs.yaml
        fields:
          - label: Référencement (SEO)
            name: seo
            widget: object
            fields:
              - { label: "Titre de l'onglet du navigateur", name: title, widget: string }
              - { label: "Description (résultats Google)", name: description, widget: text }
          - label: Introduction
            name: intro
            widget: object
            fields:
              - { label: "Petit texte au-dessus du titre", name: eyebrow, widget: string }
              - { label: "Titre — première partie", name: title, widget: string }
              - { label: "Titre — fin mise en valeur", name: titleEmphasis, widget: string }
              - { label: "Texte d'introduction", name: lead, widget: text }
          - label: "Formules — Sites web"
            name: web
            widget: object
            fields:
              - label: Formules
                name: plans
                widget: list
                fields:
                  - { label: Nom, name: name, widget: string }
                  - { label: "Badge (optionnel)", name: badge, widget: string, required: false }
                  - { label: Accroche, name: tag, widget: string }
                  - { label: Prix, name: price, widget: string }
                  - { label: "Suffixe du prix (ex. /mois, ou vide)", name: priceSuffix, widget: string, required: false }
                  - { label: Détail, name: billing, widget: string }
                  - { label: "Liste des fonctionnalités", name: features, widget: list, field: { label: Fonctionnalité, name: feature, widget: string } }
                  - { label: "Texte du bouton", name: ctaLabel, widget: string }
                  - { label: "Mise en avant (formule la plus visible)", name: featured, widget: boolean, default: false }
              - { label: "Note tarifaire", name: note, widget: string }
          - label: "Formules — Réseaux sociaux"
            name: social
            widget: object
            fields:
              - label: Formules
                name: plans
                widget: list
                fields:
                  - { label: Nom, name: name, widget: string }
                  - { label: "Badge (optionnel)", name: badge, widget: string, required: false }
                  - { label: Accroche, name: tag, widget: string }
                  - { label: Prix, name: price, widget: string }
                  - { label: "Suffixe du prix (ex. /mois, ou vide)", name: priceSuffix, widget: string, required: false }
                  - { label: Détail, name: billing, widget: string }
                  - { label: "Liste des fonctionnalités", name: features, widget: list, field: { label: Fonctionnalité, name: feature, widget: string } }
                  - { label: "Texte du bouton", name: ctaLabel, widget: string }
                  - { label: "Mise en avant (formule la plus visible)", name: featured, widget: boolean, default: false }
              - { label: "Titre du bloc à la carte", name: alacarteHeading, widget: string }
              - label: "Prestations à la carte"
                name: alacarteItems
                widget: list
                fields:
                  - { label: Nom, name: label, widget: string }
                  - { label: Prix, name: price, widget: string }
              - { label: "Note tarifaire", name: note, widget: string }
          - label: "Questions fréquentes"
            name: faq
            widget: object
            fields:
              - { label: "Petit texte au-dessus du titre", name: eyebrow, widget: string }
              - { label: Titre, name: title, widget: string }
              - label: Questions
                name: items
                widget: list
                fields:
                  - { label: Question, name: question, widget: string }
                  - { label: Réponse, name: answer, widget: text }
          - label: "Appel à l'action final"
            name: finalCta
            widget: object
            fields:
              - { label: "Petit texte au-dessus du titre", name: eyebrow, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: "Bouton — texte", name: ctaLabel, widget: string }
              - { label: "Bouton — lien", name: ctaHref, widget: string }

